<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circuit board pattern background -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tech icon - Circuit chip -->
  <rect x="2" y="8" width="24" height="24" rx="2" fill="#DC2626"/>
  <rect x="6" y="12" width="16" height="16" rx="1" fill="#000000"/>
  <line x1="10" y1="16" x2="18" y2="16" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="10" y1="20" x2="18" y2="20" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="10" y1="24" x2="18" y2="24" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="14" cy="20" r="2" fill="#DC2626"/>
  
  <!-- Connection lines -->
  <line x1="2" y1="14" x2="0" y2="14" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="2" y1="20" x2="0" y2="20" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="2" y1="26" x2="0" y2="26" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="26" y1="14" x2="28" y2="14" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="26" y1="20" x2="28" y2="20" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="26" y1="26" x2="28" y2="26" stroke="#DC2626" stroke-width="1.5"/>
  
  <!-- TecShop Text -->
  <text x="32" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626">Tec</text>
  <text x="32" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Shop</text>
  
  <!-- Tech accent dots -->
  <circle cx="68" cy="12" r="1.5" fill="#DC2626"/>
  <circle cx="72" cy="12" r="1.5" fill="#DC2626"/>
  <circle cx="76" cy="12" r="1.5" fill="#DC2626"/>
</svg>